# ============================================================
# 我的歷程（時間軸）
# 由上到下依序顯示，想讓新的在最上面就把新的寫在最前面。
# 沒有確認的日期與事件請不要填。
#
# 一般項目格式：
#   - when: "2025 年 9 月"
#     title: 事件標題
#     note: 補充說明（可省略）
#
# type: current 是特別項目，會自動顯示 site.yml 裡的學校、科系、年級。
# ============================================================

entries:
  - when: 目前
    type: current

  - when: "[請填寫時間]"
    title: "[請在此加入重要事件]"
